name: Setup Carbon

inputs:
  ref:
    description: 'The ref to checkout'
    required: false
    default: 'main'

runs:
  using: "composite"
  steps:
    - name: Checkout deepinthink/carbon
      uses: actions/checkout@v4
      with:
        repository: deepinthink/carbon
        path: deepinthink/carbon
        ref: ${{ inputs.ref }}

    - name: Build && Install carbon-specification-component
      shell: bash
      run: cd deepinthink/carbon/specification/component/java/carbon-specification-component && ./mvnw install -B

    - name: Build && Install carbon-specification-iot
      shell: bash
      run: cd deepinthink/carbon/specification/iot/java/carbon-specification-iot && ./mvnw install -B

    - name: Build && Install carbon-spring-iot
      shell: bash
      run: cd deepinthink/carbon/infrastructure/framework/java/carbon-spring-iot && ./mvnw install -B

    - name: Build && Install carbon-spring-iot-benchmark
      shell: bash
      run: cd deepinthink/carbon/infrastructure/benchmark/java/carbon-spring-iot-benchmark && ./mvnw install -B

    - name: Build && Install carbon-spring-iot-gateway
      shell: bash
      run: cd deepinthink/carbon/components/gateway/java/carbon-spring-iot-component-gateway && ./mvnw install -B

    - name: Build && Install carbon-benchmark
      shell: bash
      run: cd deepinthink/carbon/templates/benchmark/java/carbon-benchmark && ./mvnw install -B


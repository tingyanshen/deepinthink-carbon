name: CI Maven

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup deepinthink/amoeba
        uses: deepinthink/amoeba/.github/actions/setup-amoeba/java@main

      - name: Build && Install carbon-specification-component
        run: cd specification/component/java/carbon-specification-component && ./mvnw install -B

      - name: Build && Install carbon-specification-iot
        run: cd specification/iot/java/carbon-specification-iot && ./mvnw install -B

      - name: Build && Install carbon-spring-iot
        run: cd infrastructure/framework/java/carbon-spring-iot && ./mvnw install -B

      - name: Build && Install carbon-spring-iot-benchmark
        run: cd infrastructure/benchmark/java/carbon-spring-iot-benchmark && ./mvnw install -B

      - name: Build && Install carbon-spring-iot-component-gateway
        run: cd components/gateway/java/carbon-spring-iot-component-gateway && ./mvnw install -B

      - name: Build && Install carbon-benchmark
        run: cd templates/benchmark/java/carbon-benchmark && ./mvnw install -B
